# Strategy Configuration for Intraday Momentum OI Unwinding

strategy:
  name: "Intraday_Momentum_OI"
  type: "Wealth Creation, Long Volatility"
  
# Data Configuration
data:
  spot_price_file: "DataDump/nifty_5min_2024.csv"
  options_file: "DataDump/combined_options_5min_2024_with_delta.csv"
  timeframe: 5  # minutes - backtesting on 5-minute candles
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  timezone: "Asia/Kolkata"  # IST timezone

# Market Configuration
market:
  instrument: "NIFTY"
  expiry_type: "weekly"  # Weekly expiry options
  option_lot_size: 75  # Standard NIFTY lot size (update if different)
  
# Entry Configuration
entry:
  start_time: "09:30"  # Entry starts after 9:30 AM IST
  end_time: "14:30"    # Last entry at 2:30 PM IST
  strikes_above_spot: 5  # Number of strikes to consider above spot
  strikes_below_spot: 5  # Number of strikes to consider below spot
  
# Exit Configuration
exit:
  exit_start_time: "14:50"  # Start exiting positions at 2:50 PM IST
  exit_end_time: "15:00"    # All positions must be closed by 3:00 PM IST
  initial_stop_loss_pct: 0.25  # 25% stop loss initially
  profit_threshold: 1.10  # 110% of buy price (10% profit)
  trailing_stop_pct: 0.10  # Trail by 10% after profit threshold reached
  vwap_stop_pct: 0.05  # Exit if price is >5% below VWAP (ONLY when trade is in loss)
  oi_increase_stop_pct: 0.10  # Exit if OI increases >10% from entry (ONLY when trade is in loss)
  
# Position Sizing
position_sizing:
  initial_capital: 100000  # 25K starting capital (Backtrader simulation capital)
  risk_per_trade_pct: 0.01  # Risk 1% of capital per trade
  position_size: 1  # 1 unit in Backtrader (represents 1 lot in real trading)
  
# Risk Management
risk_management:
  max_positions: 2 # Maximum concurrent positions
  avoid_monday_tuesday: false  # Set to true to skip Mon/Tue (near expiry)
  
# Backtesting Configuration
backtest:
  # Commission: 0.197% round-trip (buy + sell) for Indian Options Trading (NSE)
  # Breakdown per ₹1,00,000 premium:
  #   Buy side:  0.0686% (Brokerage ₹20 + SEBI 0.0001% + Exchange 0.03503% + IPFT 0.0005% + Stamp 0.003% + GST 18%)
  #   Sell side: 0.1281% (Brokerage ₹20 + SEBI 0.0001% + Exchange 0.03503% + IPFT 0.0005% + STT 0.0625% + GST 18%)
  commission: 0.001  # ~0.1% per trade (average of buy 0.0686% and sell 0.1281%)
  slippage: 0.0  # 0% slippage - removed to test strict 25% stop loss
  
# Reporting
reporting:
  output_dir: "reports"
  generate_plots: true
  save_trades: true
  metrics:
    - "Total Return"
    - "Sharpe Ratio"
    - "Max Drawdown"
    - "Win Rate"
    - "Profit Factor"
